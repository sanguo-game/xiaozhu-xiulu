<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>小猪修路记</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#f7e9d2;color:#6a4428;font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;max-width:820px;margin:0 auto}
#hud{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 8px;background:#fff6e4;border-bottom:3px solid #e8c898;flex-wrap:wrap}
.res{display:flex;gap:6px}
.res span{background:#fdebc8;border-radius:14px;padding:3px 9px 3px 4px;font-weight:bold;font-size:16px;display:flex;align-items:center;gap:3px}
.res canvas{width:22px;height:22px}
#timer{display:flex;align-items:center;gap:6px;font-weight:bold;font-size:15px}
#starbar{display:flex;gap:2px;font-size:18px}
#wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative;padding:4px}
canvas#cv{display:block;border-radius:14px;box-shadow:0 0 0 4px #e8c898;touch-action:manipulation}
#toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#6a4428e8;color:#fff6e4;padding:7px 16px;border-radius:18px;font-size:15px;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap;z-index:5}
#tip{position:absolute;left:10px;right:10px;bottom:10px;background:#fffaf0f2;border:3px solid #ff9db4;border-radius:14px;padding:8px 10px;font-size:15px;line-height:1.5;z-index:6;display:flex;gap:8px;align-items:center}
#bottom{background:#fff6e4;border-top:3px solid #e8c898;padding:6px 8px}
#goals{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:14px;margin-bottom:6px}
#goals .g{display:flex;align-items:center;gap:4px}
#goals .g.done{color:#5aa84a;text-decoration:line-through}
#btns{display:flex;gap:6px;justify-content:center}
button{font-family:inherit;font-size:15px;border:none;border-radius:20px;padding:8px 16px;cursor:pointer;background:#ff9db4;color:#fff;font-weight:bold;box-shadow:0 3px 0 #e07a94}
button.alt{background:#f2c94c;box-shadow:0 3px 0 #c89a20;color:#6a4428}
button.gray{background:#d8c8b0;box-shadow:0 3px 0 #b8a890;color:#6a4428}
#ov{position:fixed;inset:0;background:#6a442899;display:flex;align-items:center;justify-content:center;z-index:9;padding:12px;overflow:auto}
#ov .box{background:#fffaf0;border:4px solid #ffc6d2;border-radius:20px;padding:16px;max-width:460px;width:100%;text-align:center;line-height:1.6;max-height:100%;overflow:auto}
#ov h1{margin:0;font-size:30px;color:#ff7a96;letter-spacing:3px}
#ov h2{margin:4px 0;font-size:21px;color:#e8708c}
#ov .lv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
#ov .lv div{background:#fdebc8;border-radius:14px;padding:8px 4px;cursor:pointer;font-weight:bold}
#ov .lv div.lock{opacity:.4;cursor:default}
#ov .lv small{display:block;font-weight:normal;font-size:12px}
#ov .opt{background:#fdebc8;border-radius:14px;padding:8px 10px;margin:6px 0;cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px}
#ov .opt.no{opacity:.45}
#ov .opt small{display:block;font-size:12px;color:#9a7050}
#ov .wd{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0}
#ov .wd .it{background:#fdebc8;border-radius:14px;padding:4px;cursor:pointer;border:3px solid transparent;width:94px}
#ov .wd .it.on{border-color:#ff7a96;background:#ffe2ea}
#ov .wd .it.lock{opacity:.4;cursor:default}
#ov .wd canvas{width:84px;height:84px}
#ov button{margin:6px 4px}
.hide{display:none!important}
@media (min-width:900px) and (min-aspect-ratio:1/1){#app{max-width:1200px;flex-direction:row;flex-wrap:wrap}#hud{width:100%}#wrap{flex:1;height:calc(100% - 52px)}#bottom{width:300px;border-top:none;border-left:3px solid #e8c898;height:calc(100% - 52px)}#btns{flex-direction:column}#goals{flex-direction:column;font-size:16px}}
</style>
</head>
<body>
<div id="app">
 <div id="hud">
  <div class="res"><span><canvas data-ic="wood" width="44" height="44"></canvas><b id="rw">0</b></span><span><canvas data-ic="food" width="44" height="44"></canvas><b id="rf">0</b></span><span><canvas data-ic="stone" width="44" height="44"></canvas><b id="rs">0</b></span><span><canvas data-ic="gold" width="44" height="44"></canvas><b id="rg">0</b></span></div>

<div id="ov"><div class="box" id="ovbox"></div></div>

// ============ 游戏状态 ============
let G=null;
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
const key=(c,r)=>c+','+r;
function startLevel(i){
 const L=LEVELS[i];
 G={li:i,L,grid:L.map.map(r=>r.split('')),res:Object.assign({},L.start),time:0,workers:[],tasks:[],objs:{},blds:[],fx:[],paused:false,done:false,reached:false,gotFood:0,fixed:false,homes:0,sel:null};
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const ch=G.grid[r][c];if(ch==='H')G.home=[c,r];if(ch==='G')G.goal=[c,r];
  if(OBJ[ch])G.objs[key(c,r)]={ch,c,r,busy:false,ripe:true,regrow:0,prog:0};
  if(ch==='P')G.objs[key(c,r)]={ch:'P',c,r,busy:false};}
 for(let i=0;i<3;i++)addWorker();
 bgDirty=true;hideOv();resize();ui();
 if(L.tip)tip('lv'+i,L.tip);
}
function addWorker(){const n=G.workers.length;G.workers.push({x:G.home[0]+0.5+(n%3-1)*0.25,y:G.home[1]+0.55,path:[],task:null,state:'idle',t:0,face:1,outfit:SAVE.wear[n%5],seed:n*1.3,carry:null,jump:0});}
function walkable(c,r){if(c<0||r<0||c>=COLS||r>=ROWS)return false;const ch=G.grid[r][c];return ch==='='||ch==='H'||ch==='G';}
function reachSet(){const s=new Set();const q=[G.home];s.add(key(...G.home));while(q.length){const[c,r]=q.shift();for(const[dx,dy]of DIRS){const nc=c+dx,nr=r+dy;const k=key(nc,nr);if(!s.has(k)&&walkable(nc,nr)){s.add(k);q.push([nc,nr]);}}}return s;}
function standSpot(o,rs){for(const[dx,dy]of DIRS){const k=key(o.c+dx,o.r+dy);if(rs.has(k))return[o.c+dx,o.r+dy];}return null;}
function bfs(from,to){const fk=key(...from),tk=key(...to);const prev={};prev[fk]=null;const q=[from];while(q.length){const cur=q.shift();if(key(...cur)===tk)break;for(const[dx,dy]of DIRS){const n=[cur[0]+dx,cur[1]+dy];const k=key(...n);if(!(k in prev)&&walkable(...n)){prev[k]=cur;q.push(n);}}}
 if(!(tk in prev))return null;const p=[];let c=to;while(c){p.unshift(c);c=prev[key(...c)];}return p;}
const canPay=cost=>Object.keys(cost).every(k=>G.res[k]>=cost[k]);
const costTxt=cost=>Object.keys(cost).map(k=>RES_N[k]+cost[k]).join(' ');
function pay(cost){for(const k in cost)G.res[k]-=cost[k];}
function tapCell(c,r){
 if(!G||G.done)return;
 const o=G.objs[key(c,r)];
 if(!o){toast('点路上的障碍、浆果丛、木头堆这些就能干活');return;}
 if(o.busy){toast('已经有小猪去啦');return;}
 const rs=reachSet();const sp=standSpot(o,rs);
 if(!sp){toast('还过不去，先把路清出来');return;}
 if(o.ch==='P'){buildMenu(o);return;}
 const d=OBJ[o.ch];
 if(d.regrow&&!o.ripe){toast('浆果还没长好，等一会儿');return;}
 if(!canPay(d.cost)){toast(`需要 ${costTxt(d.cost)}`);return;}
 pay(d.cost);o.busy=true;G.tasks.push({o,kind:'obj'});ui();
}
function buildMenu(o){
 G.paused=true;
 showOv(`<h2>在这里盖什么？</h2>${Object.keys(BLD).map(k=>{const b=BLD[k];return `<div class="opt ${canPay(b.cost)?'':'no'}" data-b="${k}"><canvas width="90" height="70" data-bp="${k}" style="width:54px;height:42px"></canvas><div><b>${b.n}</b>　<span style="color:#e8708c">${costTxt(b.cost)}</span><small>${b.d}</small></div></div>`}).join('')}<button class="gray" id="bc">算了</button>`);
 document.querySelectorAll('canvas[data-bp]').forEach(c=>{const g=c.getContext('2d');const old=x;x=g;drawHut(45,58,1.5,c.dataset.bp,0);x=old;});
 document.querySelectorAll('.opt[data-b]').forEach(el=>el.onclick=()=>{const b=BLD[el.dataset.b];if(!canPay(b.cost)){toast(`需要 ${costTxt(b.cost)}`);return;}pay(b.cost);o.busy=true;o.plan=el.dataset.b;G.tasks.push({o,kind:'build',b:el.dataset.b});hideOv();G.paused=false;ui();});
 $('bc').onclick=()=>{hideOv();G.paused=false;};
}
function finishTask(w){
 const tk=w.task,o=tk.o;w.task=null;
 if(tk.kind==='build'){G.grid[o.r][o.c]='X';delete G.objs[key(o.c,o.r)];const b={k:tk.b,c:o.c,r:o.r,t:0};G.blds.push(b);
  if(tk.b==='house'){addWorker();const nw=G.workers[G.workers.length-1];nw.x=o.c+.5;nw.y=o.r+.5;fx(o.c,o.r,'多一只小猪！','#ff7a96');}
  else fx(o.c,o.r,BLD[tk.b].n+'盖好啦','#ff7a96');
  w.jump=1;ui();return;}
 const d=OBJ[o.ch];
 for(const k in d.gain){G.res[k]+=d.gain[k];if(k==='food')G.gotFood+=d.gain[k];}
 const gtxt=Object.keys(d.gain).map(k=>RES_N[k]+'+'+d.gain[k]).join(' ');
 if(d.road){G.grid[o.r][o.c]='=';delete G.objs[key(o.c,o.r)];if(d.fix)G.fixed=true;fx(o.c,o.r,gtxt||(d.fix?'喷泉修好啦':o.ch==='B'?'桥修好啦':'路通啦'),'#5aa84a');bgDirty=true;}
 else if(d.once){delete G.objs[key(o.c,o.r)];G.grid[o.r][o.c]='.';fx(o.c,o.r,gtxt,'#e8a020');}
 else{o.busy=false;o.ripe=false;o.regrow=d.regrow;fx(o.c,o.r,gtxt,'#e8a020');}
 if(d.gain&&Object.keys(d.gain).length)w.carry=Object.keys(d.gain)[0];
 w.jump=0.6;checkReach();ui();
}
function fx(c,r,s,col){G.fx.push({x:c+.5,y:r+.2,s,col,t:0});}
function checkReach(){if(!G.reached&&reachSet().has(key(...G.goal))){G.reached=true;fx(G.goal[0],G.goal[1],'路修通啦！','#ff7a96');}}
function goalDone(g){
 if(g.k==='reach')return G.reached;
 if(g.k==='build')return G.blds.filter(b=>b.k===g.b).length>=g.n;
 if(g.k==='have')return G.res[g.r]>=g.n;
 if(g.k==='fix')return G.fixed;
}
function goalTxt(g){if(g.k==='reach')return '把路修到村口';if(g.k==='build')return `盖${g.n}个${BLD[g.b].n}（${Math.min(g.n,G.blds.filter(b=>b.k===g.b).length)}/${g.n}）`;if(g.k==='have')return `攒够${g.n}${RES_N[g.r]==='粮'?'份粮食':RES_N[g.r]}（${Math.min(g.n,G.res[g.r])}/${g.n}）`;if(g.k==='fix')return '修好喷泉';}
function update(dt){
 if(!G||G.paused||G.done)return;
 G.time+=dt;
 for(const k in G.objs){const o=G.objs[k];if(o.regrow>0){o.regrow-=dt;if(o.regrow<=0){o.ripe=true;}}}
 for(const b of G.blds){const d=BLD[b.k];if(d.prod){b.t+=dt;if(b.t>=d.every){b.t=0;G.res[d.prod]++;if(d.prod==='food')G.gotFood++;fx(b.c,b.r,RES_N[d.prod]+'+1','#e8a020');ui();}}}
 // 分配任务
 for(const w of G.workers){
  w.jump=Math.max(0,w.jump-dt*2);
  if(w.state==='idle'&&G.tasks.length){
   const rs=reachSet();const cur=[Math.floor(w.x),Math.floor(w.y)];
   const idx=G.tasks.findIndex(tk=>standSpot(tk.o,rs));
   if(idx>=0){const tk=G.tasks.splice(idx,1)[0];const sp=standSpot(tk.o,rs);const from=walkable(...cur)?cur:G.home;const path=bfs(from,sp);
    if(path){w.task=tk;w.path=path.slice(1).map(p=>[p[0]+.5,p[1]+.55]);w.path.push([sp[0]+.5+(tk.o.c-sp[0])*0.25,sp[1]+.55+(tk.o.r-sp[1])*0.25]);w.state='walk';w.carry=null;}}
  }
  if(w.state==='walk'||w.state==='home'){
   const tgt=w.path[0];if(!tgt){if(w.state==='walk'){w.state='work';w.t=0;w.face=w.task.o.c+.5>=w.x?1:-1;}else w.state='idle';continue;}
   const dx=tgt[0]-w.x,dy=tgt[1]-w.y,dist=Math.hypot(dx,dy),sp=2.4*dt;if(Math.abs(dx)>0.02)w.face=dx>0?1:-1;
   if(dist<=sp){w.x=tgt[0];w.y=tgt[1];w.path.shift();}else{w.x+=dx/dist*sp;w.y+=dy/dist*sp;}
  }
  if(w.state==='work'){const tk=w.task;const dur=tk.kind==='build'?BLD[tk.b].time:OBJ[tk.o.ch].time;w.t+=dt;tk.o.prog=w.t/dur;
   if(w.t>=dur){finishTask(w);
    if(G.tasks.length){w.state='idle';}else{const cur=[Math.floor(w.x),Math.floor(w.y)];const p=walkable(...cur)?bfs(cur,G.home):null;w.path=p?p.slice(1).map(q=>[q[0]+.5+(Math.random()-0.5)*0.4,q[1]+.55]):[];w.state='home';}}}
  if(w.state==='home'&&G.tasks.length){w.state='idle';w.path=[];}
 }
 G.fx=G.fx.filter(f=>(f.t+=dt)<1.6);
 if(!G.done&&G.L.goals.every(goalDone))win();
 tickUI+=dt;if(tickUI>0.25){tickUI=0;ui();}
}
let tickUI=0;
function starsNow(){const t=G.time;return t<=G.L.star[0]?3:t<=G.L.star[1]?2:1;}
function win(){
 G.done=true;const st=starsNow();const k=G.li;SAVE.stars[k]=Math.max(SAVE.stars[k]||0,st);SAVE.unlock=Math.max(SAVE.unlock,Math.min(LEVELS.length,k+2));save();
 for(const w of G.workers)w.jump=1;
 setTimeout(()=>{
  const newOut=OUTFITS.filter(o=>o.need>0&&o.need<=totalStars()&&!SAVE['got'+o.id]);newOut.forEach(o=>SAVE['got'+o.id]=1);save();
  showOv(`<h1>过关啦！</h1><div style="font-size:40px;letter-spacing:4px">${'⭐'.repeat(st)}${'<span style="opacity:.25">⭐</span>'.repeat(3-st)}</div><p>用时 ${fmt(G.time)}　${st===3?'太厉害了！':st===2?'很棒哦！':'下次再快一点就能拿更多星星'}</p>
  ${newOut.length?`<p style="color:#ff7a96;font-weight:bold">🎁 解锁新衣服：${newOut.map(o=>o.n).join('、')}！去衣柜看看吧</p>`:''}
  ${k+1<LEVELS.length?'<button id="nx">下一关</button>':'<p>目前的关卡都过完啦！更多关卡下次补上～</p>'}<button class="alt" id="again">再玩一次</button><button class="gray" id="home">选关</button>`);
  if($('nx'))$('nx').onclick=()=>startLevel(k+1);$('again').onclick=()=>startLevel(k);$('home').onclick=levels;
 },1200);
}
// ============ 绘制 ============
function resize(){const w=$('wrap');const W=w.clientWidth-12,H=w.clientHeight-12;cell=Math.max(20,Math.floor(Math.min(W/COLS,H/ROWS)));dpr=window.devicePixelRatio||1;
 cv.style.width=cell*COLS+'px';cv.style.height=cell*ROWS+'px';cv.width=Math.round(cell*COLS*dpr);cv.height=Math.round(cell*ROWS*dpr);bgDirty=true;}
function buildBG(){
 BG=document.createElement('canvas');BG.width=cv.width;BG.height=cv.height;const old=x;x=BG.getContext('2d');x.scale(dpr,dpr);const C=cell;
 x.fillStyle='#8cc95a';x.fillRect(0,0,C*COLS,C*ROWS);
 for(let i=0;i<60;i++)E(hs(i,1)*C*COLS,hs(i,2)*C*ROWS,C*(0.5+hs(i,3)),C*(0.25+hs(i,4)*0.4),hs(i,5)<0.5?'#7cc04e':'#9ad064');
 for(let i=0;i<220;i++){const a=hs(i,7)*C*COLS,b=hs(i,8)*C*ROWS;x.strokeStyle=hs(i,9)<0.5?'#6aa840':'#a8dc72';x.lineWidth=1.2;x.beginPath();x.moveTo(a,b);x.lineTo(a-2,b-C*0.12);x.moveTo(a+2,b);x.lineTo(a+3,b-C*0.14);x.stroke();}
 // 水
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(G.grid[r][c]==='~'||(G.L.map[r][c]==='B')){x.fillStyle='#6ab4e0';x.fillRect(c*C,r*C-1,C,C+2);}
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(G.L.map[r][c]==='~'||G.L.map[r][c]==='B'){if(r>0&&!'~B'.includes(G.L.map[r-1][c])){x.fillStyle='#d8eef8';x.fillRect(c*C,r*C,C,3);}if(r<ROWS-1&&!'~B'.includes(G.L.map[r+1][c])){x.fillStyle='#4a94c0';x.fillRect(c*C,r*C+C-3,C,3);}}
 // 路
 const isR=(c,r)=>{if(c<0||r<0||c>=COLS||r>=ROWS)return false;const ch=G.L.map[r][c];return '=HGTRMFB'.includes(ch);};
 x.lineCap='round';x.lineJoin='round';
 const seg=(w,col)=>{x.strokeStyle=col;x.lineWidth=w;x.beginPath();for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){if(!isR(c,r)||G.L.map[r][c]==='B')continue;const X=(c+.5)*C,Y=(r+.5)*C;x.moveTo(X,Y);x.lineTo(X+0.01,Y);
   if(isR(c+1,r)&&G.L.map[r][c+1]!=='B'){x.moveTo(X,Y);x.lineTo(X+C,Y);}if(isR(c,r+1)&&G.L.map[r+1][c]!=='B'){x.moveTo(X,Y);x.lineTo(X,Y+C);}}x.stroke();};
 seg(C*0.86,'rgba(90,70,30,.16)');seg(C*0.78,'#d9b878');seg(C*0.58,'#e8cf98');seg(C*0.2,'#f0dcaa');
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(isR(c,r))for(let i=0;i<3;i++){const a=(c+0.2+hs(c*3+i,r)*0.6)*C,b=(r+0.2+hs(c,r*3+i)*0.6)*C;E(a,b,C*0.05,C*0.035,'#c8a868');}
 // 花
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const ch=G.L.map[r][c];if(ch==='f'||(ch==='.'&&hs(c,r)>0.8)){for(let i=0;i<(ch==='f'?5:2);i++){const a=(c+0.15+hs(c+i,r*7)*0.7)*C,b=(r+0.2+hs(c*5,r+i)*0.6)*C;E(a,b,C*0.06,C*0.06,['#fff6d0','#ffd84a','#f7a6c0','#e86a5a'][i%4]);E(a,b,C*0.025,C*0.025,'#f0a020');}}}
 x=old;bgDirty=false;
}
function draw(){
 T=performance.now()/1000;
 ctx.setTransform(1,0,0,1,0,0);
 if(!G){ctx.fillStyle='#8cc95a';ctx.fillRect(0,0,cv.width,cv.height);return;}
 if(bgDirty||!BG)buildBG();
 ctx.drawImage(BG,0,0);ctx.setTransform(dpr,0,0,dpr,0,0);x=ctx;
 const C=cell,s=C/40;
 // 水波
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(G.L.map[r][c]==='~'){for(let i=0;i<2;i++){const off=((T*0.3+hs(c,r+i))%1)*C;E(c*C+off,r*C+C*(0.35+i*0.35),C*0.12,C*0.03,'rgba(255,255,255,.6)');}}
 const items=[];
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const ch=G.L.map[r][c];const X=(c+.5)*C,Y=(r+.8)*C;
  if(ch==='t')items.push({y:r+.8,f:()=>drawTree(X,Y,s,T)});
  if(ch==='r')items.push({y:r+.7,f:()=>drawRock(X,Y-C*0.1,s*0.8)});
  if(ch==='B')items.push({y:r+.3,f:()=>drawBridge(X,(r+.5)*C,s,G.grid[r][c]==='=')});
  if(ch==='F'&&G.grid[r][c]==='=')items.push({y:r+.6,f:()=>drawFountain(X,(r+.6)*C,s,true)});}
 items.push({y:G.home[1]+.8,f:()=>drawHut((G.home[0]+.5)*C,(G.home[1]+.75)*C,s*1.1,'home',T)});
 items.push({y:G.goal[1]+.8,f:()=>drawGate((G.goal[0]+.5)*C,(G.goal[1]+.85)*C,s*0.85,G.reached)});
 for(const b of G.blds)items.push({y:b.r+.8,f:()=>drawHut((b.c+.5)*C,(b.r+.8)*C,s,b.k,T)});
 for(const k in G.objs){const o=G.objs[k];const X=(o.c+.5)*C,Y=(o.r+.5)*C;
  items.push({y:o.r+.7,f:()=>{
   const shake=o.busy&&o.prog>0&&o.prog<1?Math.sin(T*40)*1.5:0;
   if(o.ch==='T')drawLog(X,Y,s,shake);if(o.ch==='R')drawRock(X+shake,Y+C*0.2,s*1.1);if(o.ch==='M')drawMud(X,Y,s);if(o.ch==='B'){}
   if(o.ch==='F')drawFountain(X,Y+C*0.1,s,false);if(o.ch==='b')drawBush(X,Y+C*0.3,s,o.ripe);if('wsg'.includes(o.ch))drawPile(X,Y+C*0.25,s,o.ch);
   if(o.ch==='P'){if(!o.busy){x.setLineDash([4,3]);x.strokeStyle='rgba(255,255,255,.85)';x.lineWidth=2;x.beginPath();x.roundRect(X-C*0.4,Y-C*0.32,C*0.8,C*0.64,6);x.stroke();x.setLineDash([]);x.fillStyle='rgba(255,255,255,.9)';x.font=`bold ${C*0.4}px sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText('+',X,Y);}
    else drawHut(X,Y+C*0.3,s*0.9*Math.max(0.3,o.prog||0.3),o.plan,T);}
   // 价格/进度
   if(o.busy&&o.prog>0){RR(X-C*0.35,Y-C*0.62,C*0.7,C*0.1,'rgba(90,60,30,.5)',3);RR(X-C*0.35,Y-C*0.62,C*0.7*Math.min(1,o.prog),C*0.1,'#7ad06a',3);}
   else if(o.busy){x.fillStyle='#ff7a96';x.beginPath();x.moveTo(X,Y-C*0.35);x.lineTo(X,Y-C*0.75);x.stroke();P([[X,Y-C*0.75],[X+C*0.25,Y-C*0.65],[X,Y-C*0.55]],'#ff7a96');}
   else if(o.ch!=='P'){const d=OBJ[o.ch];const ks=Object.keys(d.cost);if(ks.length){const w=C*0.36*ks.length+C*0.1;RR(X-w/2,Y-C*0.72,w,C*0.3,'rgba(255,250,235,.92)',C*0.15);ks.forEach((k,i)=>{icon(k,X-w/2+C*0.2+i*C*0.36,Y-C*0.57,s*0.55);x.fillStyle=canPay(d.cost)?'#6a4428':'#e0405a';x.font=`bold ${C*0.2}px sans-serif`;x.textAlign='left';x.textBaseline='middle';x.fillText(d.cost[k],X-w/2+C*0.3+i*C*0.36,Y-C*0.56);});}}
  }});}
 G.workers.forEach((w,i)=>{items.push({y:w.y,f:()=>{const work=w.state==='work'?(w.task.kind==='build'?'hammer':w.task.o.ch==='R'||w.task.o.ch==='s'?'pick':w.task.o.ch==='T'?'axe':'hammer'):null;
   pig(w.x*C,w.y*C,s*0.42,T+w.seed,w.outfit,{walk:w.state==='walk'||w.state==='home',work,face:w.face,carry:w.state==='home'?w.carry:null,jump:Math.sin(Math.min(1,w.jump)*Math.PI)*12,seed:w.seed,happy:G.done});}});});
 items.sort((a,b)=>a.y-b.y).forEach(o=>o.f());
 for(const f of G.fx){const a=Math.max(0,1-f.t/1.6);x.globalAlpha=a;x.font=`bold ${C*0.32}px "PingFang SC","Microsoft YaHei",sans-serif`;x.textAlign='center';x.textBaseline='middle';const tw=x.measureText(f.s).width;const Y=(f.y-0.4-f.t*0.5)*C;
  RR(f.x*C-tw/2-8,Y-C*0.22,tw+16,C*0.44,'rgba(255,250,235,.95)',C*0.22);x.fillStyle=f.col;x.fillText(f.s,f.x*C,Y);x.globalAlpha=1;}
 if(G.paused&&$('ov').classList.contains('hide')){x.fillStyle='rgba(106,68,40,.4)';x.fillRect(0,0,C*COLS,C*ROWS);x.fillStyle='#fff';x.font=`bold ${C*0.7}px sans-serif`;x.textAlign='center';x.fillText('暂停中',C*COLS/2,C*ROWS/2);}
}
// ============ 界面 ============
const $=id=>document.getElementById(id);
let toastT;function toast(s){const t=$('toast');t.textContent=s;t.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>t.style.opacity=0,1800);}
function tip(k,html){if(SAVE.tips[k])return;SAVE.tips[k]=1;save();const t=$('tip');t.innerHTML=`<div style="flex:1">🐷 ${html}</div><button>好哒</button>`;t.classList.remove('hide');t.querySelector('button').onclick=()=>t.classList.add('hide');}
const fmt=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
function ui(){
 if(!G)return;
 $('rw').textContent=G.res.wood;$('rf').textContent=G.res.food;$('rs').textContent=G.res.stone;$('rg').textContent=G.res.gold;
 $('tm').textContent=fmt(G.time);const st=starsNow();$('starbar').innerHTML='⭐'.repeat(st)+'<span style="opacity:.25">⭐</span>'.repeat(3-st);
 $('goals').innerHTML='<b>任务：</b>'+G.L.goals.map(g=>`<span class="g ${goalDone(g)?'done':''}">${goalDone(g)?'✅':'⬜'} ${goalTxt(g)}</span>`).join('');
 $('bPause').textContent=G.paused?'继续':'暂停';
}
function showOv(h){$('ovbox').innerHTML=h;$('ov').classList.remove('hide');}
function hideOv(){$('ov').classList.add('hide');}
function pigCanvas(c,v){const g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);const old=x;x=g;pig(c.width/2,c.height-12,c.width/150,1,v,{});x=old;}
function title(){
 G=null;
 showOv(`<h1>小猪修路记</h1><div style="display:flex;justify-content:center;gap:4px;margin:6px 0">${[0,1,2].map(v=>`<canvas data-pv="${v}" width="140" height="140" style="width:90px;height:90px"></canvas>`).join('')}</div>
  <p>小猪一家要把回村的路修通，<br>清树搬石、盖房种地，一起加油吧！</p><button id="go">开始玩</button><button class="alt" id="wd">👗 衣柜</button>`);
 document.querySelectorAll('canvas[data-pv]').forEach(c=>pigCanvas(c,+c.dataset.pv));
 $('go').onclick=levels;$('wd').onclick=()=>wardrobe(title);
}
function levels(){
 if(G)G.paused=true;
 showOv(`<h2>选一关</h2><p style="font-size:13px">一共拿了 ${totalStars()} 颗星星　越快过关星星越多</p><div class="lv">${LEVELS.map((l,i)=>{const lk=i>=SAVE.unlock,s=SAVE.stars[i]||0;return `<div class="${lk?'lock':''}" data-l="${i}">第${i+1}关<small>${lk?'🔒':l.n}</small><small>${'⭐'.repeat(s)}${'<span style="opacity:.25">⭐</span>'.repeat(3-s)}</small></div>`}).join('')}</div>${G?'<button class="gray" id="bk">回去接着玩</button>':'<button class="gray" id="bk">返回</button>'}`);
 document.querySelectorAll('[data-l]').forEach(el=>el.onclick=()=>{const i=+el.dataset.l;if(i<SAVE.unlock)startLevel(i);});
 $('bk').onclick=()=>{if(G){hideOv();G.paused=false;ui();}else title();};
}
function wardrobe(back){
 const wasP=G?G.paused:false;if(G)G.paused=true;
 const n=G?G.workers.length:3;const ts=totalStars();
 const render=(sel)=>{
  showOv(`<h2>👗 衣柜</h2><p style="font-size:13px">先点一只小猪，再挑衣服</p><div class="wd">${Array.from({length:n},(_,i)=>`<div class="it ${i===sel?'on':''}" data-p="${i}"><canvas width="168" height="168" data-w="${i}"></canvas><div style="font-size:13px">小猪${['一','二','三','四','五'][i]}</div></div>`).join('')}</div>
   <h2 style="font-size:16px">衣服</h2><div class="wd">${OUTFITS.map(o=>{const lk=o.need>ts;return `<div class="it ${lk?'lock':''} ${SAVE.wear[sel]===o.id?'on':''}" data-o="${o.id}"><canvas width="168" height="168" data-ov="${o.id}"></canvas><div style="font-size:13px">${o.n}${lk?`<br><small>🔒 ${o.need}颗星</small>`:''}</div></div>`}).join('')}</div><button id="bk">好啦</button>`);
  document.querySelectorAll('canvas[data-w]').forEach(c=>pigCanvas(c,SAVE.wear[+c.dataset.w]));
  document.querySelectorAll('canvas[data-ov]').forEach(c=>pigCanvas(c,+c.dataset.ov));
  document.querySelectorAll('[data-p]').forEach(el=>el.onclick=()=>render(+el.dataset.p));
  document.querySelectorAll('[data-o]').forEach(el=>el.onclick=()=>{const o=OUTFITS[+el.dataset.o];if(o.need>ts){toast(`集齐${o.need}颗星星就能穿啦`);return;}SAVE.wear[sel]=o.id;save();if(G&&G.workers[sel])G.workers[sel].outfit=o.id;render(sel);});
  $('bk').onclick=()=>{if(G){hideOv();G.paused=wasP;ui();}else back();};
 };
 render(0);
}
cv.addEventListener('pointerdown',ev=>{if(!G)return;const rc=cv.getBoundingClientRect();const c=Math.floor((ev.clientX-rc.left)/cell),r=Math.floor((ev.clientY-rc.top)/cell);if(c<0||r<0||c>=COLS||r>=ROWS)return;
 // 容错：点到相邻格的大东西也算
 if(!G.objs[key(c,r)]){const fy=(ev.clientY-rc.top)/cell-r;if(fy<0.4&&G.objs[key(c,r-1)]&&'TbwsgF'.includes(G.objs[key(c,r-1)].ch)){tapCell(c,r-1);return;}}
 tapCell(c,r);});
$('bWard').onclick=()=>wardrobe(()=>{});
$('bPause').onclick=()=>{if(!G||G.done)return;G.paused=!G.paused;ui();};
$('bMenu').onclick=levels;
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&!G.done){G.paused=true;ui();}});
let last=performance.now();
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop);}
window.addEventListener('resize',resize);try{new ResizeObserver(resize).observe($('wrap'));}catch(e){}
resize();title();requestAnimationFrame(loop);
</script>
